name: Build Gestione Preventivi Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: powershell
        run: |
          $iscc = "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\\Program Files\\Inno Setup 6\\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup non trovato" }
          & $iscc "installer\\Gestione-Preventivi.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable
        shell: powershell
        run: |
          Compress-Archive -Path "build\\windows\\x64\\runner\\Release\\*" -DestinationPath "Gestione-Preventivi-Windows-Portable.zip" -Force

      - name: Verify installer
        shell: powershell
        run: |
          if (-not (Test-Path "build\\installer\\Gestione-Preventivi-Setup.exe")) {
            throw "Gestione-Preventivi-Setup.exe non trovato"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Gestione-Preventivi-Setup
          path: build/installer/Gestione-Preventivi-Setup.exe
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: Gestione-Preventivi-Windows-Portable
          path: Gestione-Preventivi-Windows-Portable.zip
          if-no-files-found: error
